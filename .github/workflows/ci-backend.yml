# Backend CI — lint, typecheck, test against a real PostgreSQL service.

name: CI · Backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rentflow
          POSTGRES_PASSWORD: rentflow
          POSTGRES_DB: rentflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rentflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://rentflow:rentflow@localhost:5432/rentflow_test
      SECRET_KEY: test-secret-not-used-outside-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing
