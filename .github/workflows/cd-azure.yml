# Deploy to Azure Container Apps.
# Auth uses OIDC federated credentials — no long-lived secrets.
#
# push to main       -> staging
# manual dispatch    -> staging or production (production waits for a
#                       required reviewer on the `production` GitHub Environment)
#
# Per deploy: build + push images tagged with the commit SHA, run migrations as
# a one-off job, then roll out api then web. Each new revision is health-checked
# on its own URL at 0% traffic before traffic shifts (scripts/azure/deploy-revision.sh).
#
# Required configuration (docs/deployment.md §Required GitHub secrets / variables):
#   repo secrets:         AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   environment secret:   AZURE_CLIENT_ID   (client ID of id-rentflow-github-<env>)
#   environment variables: ACR_NAME, RESOURCE_GROUP

name: CD · Azure

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  id-token: write   # required for OIDC
  contents: read

# One deploy per environment at a time; never cancel one half-way through.
concurrency:
  group: cd-azure-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ steps.urls.outputs.web_url }}
    env:
      TARGET_ENV: ${{ inputs.environment || 'staging' }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}

    steps:
      - uses: actions/checkout@v7

      - name: Check deployment configuration
        id: config
        env:
          HAS_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}
        run: |
          missing=()
          [[ "$HAS_CLIENT_ID" == true ]] || missing+=("secret AZURE_CLIENT_ID")
          [[ "$HAS_TENANT_ID" == true ]] || missing+=("secret AZURE_TENANT_ID")
          [[ "$HAS_SUBSCRIPTION_ID" == true ]] || missing+=("secret AZURE_SUBSCRIPTION_ID")
          [[ -n "$ACR_NAME" ]] || missing+=("variable ACR_NAME")
          [[ -n "$RESOURCE_GROUP" ]] || missing+=("variable RESOURCE_GROUP")
          if [[ "$HAS_CLIENT_ID" != true && -z "$ACR_NAME" && -z "$RESOURCE_GROUP" ]]; then
            # The GitHub Environment has none of its per-environment settings yet:
            # not provisioned (docs/deployment.md §First-time setup).
            echo "::warning::$TARGET_ENV is not configured for deployment yet; skipping."
            echo "configured=false" >>"$GITHUB_OUTPUT"
          elif ((${#missing[@]})); then
            for item in "${missing[@]}"; do
              echo "::error::$item is not set for the $TARGET_ENV environment"
            done
            exit 1
          else
            echo "configured=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: azure/login@v2
        if: steps.config.outputs.configured == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image tags and app URLs
        if: steps.config.outputs.configured == 'true'
        id: urls
        run: |
          source scripts/azure/lib.sh
          rentflow_env "$TARGET_ENV"
          registry="$ACR_NAME.azurecr.io"
          api_fqdn=$(az containerapp show -n "$API_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          web_fqdn=$(az containerapp show -n "$WEB_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          {
            echo "api_image=$registry/rentflow-api:${GITHUB_SHA}"
            echo "web_image=$registry/rentflow-web:${GITHUB_SHA}"
            echo "api_url=https://$api_fqdn"
            echo "web_url=https://$web_fqdn"
            # Revision suffixes must start with a letter and be unique per app.
            echo "revision_suffix=r${GITHUB_SHA::7}-${GITHUB_RUN_ATTEMPT}"
          } >>"$GITHUB_OUTPUT"

      - name: Build and push images
        if: steps.config.outputs.configured == 'true'
        run: |
          az acr login --name "$ACR_NAME"
          docker build --target runtime -t "${{ steps.urls.outputs.api_image }}" ./backend
          # NEXT_PUBLIC_* values are inlined at build time, per environment.
          docker build --target runtime \
            --build-arg NEXT_PUBLIC_API_URL="${{ steps.urls.outputs.api_url }}/api/v1" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ steps.urls.outputs.web_url }}" \
            -t "${{ steps.urls.outputs.web_image }}" ./frontend
          docker push "${{ steps.urls.outputs.api_image }}"
          docker push "${{ steps.urls.outputs.web_image }}"

      - name: Run migrations
        if: steps.config.outputs.configured == 'true'
        # Must complete before the new revision takes traffic.
        run: bash scripts/azure/run-migrations.sh "$TARGET_ENV" "${{ steps.urls.outputs.api_image }}"

      - name: Deploy API
        if: steps.config.outputs.configured == 'true'
        id: api
        run: >-
          bash scripts/azure/deploy-revision.sh "$TARGET_ENV" api
          "${{ steps.urls.outputs.api_image }}" "${{ steps.urls.outputs.revision_suffix }}"

      - name: Deploy web
        if: steps.config.outputs.configured == 'true'
        id: web
        run: >-
          bash scripts/azure/deploy-revision.sh "$TARGET_ENV" web
          "${{ steps.urls.outputs.web_image }}" "${{ steps.urls.outputs.revision_suffix }}"

      - name: Summary
        if: always() && steps.config.outputs.configured == 'true'
        run: |
          {
            echo "### Deploy to \`$TARGET_ENV\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| API | ${{ steps.urls.outputs.api_url }} |"
            echo "| Web | ${{ steps.urls.outputs.web_url }} |"
            echo "| API revision | \`${{ steps.api.outputs.api_new_revision }}\` (previous: \`${{ steps.api.outputs.api_previous_revision }}\`) |"
            echo "| Web revision | \`${{ steps.web.outputs.web_new_revision }}\` (previous: \`${{ steps.web.outputs.web_previous_revision }}\`) |"
            echo
            echo "Roll back with \`scripts/azure/rollback.sh $TARGET_ENV api\` (and/or \`web\`)."
          } >>"$GITHUB_STEP_SUMMARY"
