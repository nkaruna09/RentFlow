[project]
name = "rentflow-api"
version = "0.1.0"
description = "RentFlow backend — FastAPI over PostgreSQL"
requires-python = ">=3.12"
dependencies = []   # TODO: pin runtime dependencies (see requirements.txt)

[project.optional-dependencies]
dev = []            # TODO: ruff, mypy, pytest, pytest-asyncio, httpx

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]   # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
